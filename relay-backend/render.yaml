services:
  - type: web
    name: relay-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false          # set to your Render PostgreSQL URL
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-relay-site.netlify.app